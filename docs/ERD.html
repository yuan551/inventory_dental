<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Relationship Diagram - Dental Clinic Inventory Management</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }
        
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }
        
        svg {
            display: block;
            margin: 0 auto;
        }
        
        .entity-rect {
            fill: #FFD4A3;
            stroke: #333;
            stroke-width: 2;
        }
        
        .attribute-oval {
            fill: #B8E6E6;
            stroke: #333;
            stroke-width: 1.5;
        }
        
        .pk-attribute-oval {
            fill: #A0D8D8;
            stroke: #333;
            stroke-width: 2;
        }
        
        .connection-line {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
        }
        
        .entity-text {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #333;
        }
        
        .attribute-text {
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #333;
        }
        
        .pk-text {
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #333;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
